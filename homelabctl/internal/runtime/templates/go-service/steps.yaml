      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The spec is the source of truth, so what is committed must match
      # what it generates. Without this a spec change can merge with
      # stale code and the API silently diverges from its documentation.
      - name: Check generated code is current
        run: |
          go generate ./...
          git diff --exit-code -- api/ \
            || { echo "::error::api/ is stale - run 'go generate ./...' and commit"; exit 1; }

      - name: Test
        run: go test -race ./...

      # CGO_ENABLED=0: a cgo binary links against glibc and will not run on
      # alpine, and that only shows up at container start.
      #
      # -X main.version stamps the commit into the binary, so every log
      # line says which build produced it. Without it main.version stays
      # "dev" and the field is worse than absent.
      - name: Build
        run: |
          CGO_ENABLED=0 go build \
            -ldflags "-X main.version=$GITHUB_SHA" \
            -o bin/app .
