      # go-version-file and cache-dependency-path are ACTION INPUTS, not
      # shell commands, so defaults.run.working-directory does not apply
      # to them - they resolve from the repository root. In a monorepo a
      # bare `go.mod` is a path to nothing, and setup-go fails with "the
      # specified go version file at: go.mod does not exist" before a
      # single test has run.
      - uses: actions/setup-go@v5
        with:
          go-version-file: {{ if .PathFilter }}{{ .PathFilter }}/{{ end }}go.mod
          cache: true
          cache-dependency-path: {{ if .PathFilter }}{{ .PathFilter }}/{{ end }}go.sum

      - name: Test
        run: go test -race ./...

      # CGO_ENABLED=0: a cgo binary links against glibc and will not run on
      # alpine, and that only shows up at container start.
      #
      # -X main.version stamps the commit into the binary, so every log
      # line says which build produced it. Without it main.version stays
      # "dev" and the field is worse than absent.
      - name: Build
        run: |
          CGO_ENABLED=0 go build \
            -ldflags "-X main.version=$GITHUB_SHA" \
            -o bin/app .
