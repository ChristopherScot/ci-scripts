      # cache-dependency-path is an ACTION INPUT and resolves from the
      # repository root, not from defaults.run.working-directory. Without
      # it, a monorepo service fails with "Dependencies lock file is not
      # found in /home/runner/work/<repo>/<repo>" before installing
      # anything.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: {{ .ServiceDir }}/package-lock.json

      # In this service's own directory, from its own lockfile.
      #
      # A service consuming a sibling's generated TypeScript client
      # resolves it from npm like any other dependency, so there is
      # nothing to hoist and no workspace to install from. That was not
      # always true: before the client was published the only way to
      # resolve it was an npm workspace, which links the sibling by
      # SYMLINK - fine in CI, fatal in the image, where the link dangles
      # and node exits with ERR_MODULE_NOT_FOUND.
      - name: Install
        run: npm ci

      # Not --if-present: the scaffold always ships tests, so a missing
      # script means someone removed them, and CI should say so rather
      # than skip silently.
      - name: Test
        run: npm test
