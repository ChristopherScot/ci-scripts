      # cache-dependency-path is an ACTION INPUT and resolves from the
      # repository root, not from defaults.run.working-directory. Without
      # it, a monorepo service fails with "Dependencies lock file is not
      # found in /home/runner/work/<repo>/<repo>" before installing
      # anything.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: {{ .ServiceDir }}/package-lock.json

      - name: Install
        run: npm ci

      # Not --if-present: the scaffold always ships tests, so a missing
      # script means someone removed them, and CI should say so rather
      # than skip silently.
      # Before the tests, because a type error is a faster and clearer
      # failure than whatever it causes at runtime.
      #
      # --if-present, because not every node service consumes a generated
      # client and one without a typecheck script should not fail here.
      # A service that HAS one gets its API contract checked: this is
      # what catches a client that has drifted from the spec, which
      # otherwise shows up as a 404 in production or not at all.
      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test

      # Build the bundle AND run it.
      #
      # Locally this service runs `node server.ts`; the image runs a Vite
      # bundle. Those are two paths, and a bundler that drops something -
      # a dynamic import, a package whose ESM entry differs from its
      # CommonJS one - produces an artifact that only fails in
      # production. Building proves it compiles; starting it and getting
      # a 200 proves it runs.
      - name: Build the production bundle
        run: npm run build

      - name: Smoke-test the bundle
        run: |
          PORT=8099 npm run start:dist &
          pid=$!
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8099/healthz >/dev/null 2>&1; then
              echo "the bundle serves /healthz"
              kill $pid
              exit 0
            fi
            sleep 1
          done
          echo "::error::the bundle did not answer /healthz within 20s"
          kill $pid 2>/dev/null || true
          exit 1
