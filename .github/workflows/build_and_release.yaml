name: Build and Release

on:
  push:
    # main only: without this, a VERSION bump on any branch publishes a
    # release. v1.0.0 shipped from an unmerged PR branch that way.
    branches: [main]
    paths:
      - "VERSION"

jobs:
  discover-subfolders:
    runs-on: ubuntu-latest
    outputs:
      subfolders: ${{ steps.set-output.outputs.subfolders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discover subfolders
        id: set-output
        run: |
          subfolders=$(ls -d */ | sed 's#/##')
          subfolders_json=$(echo "$subfolders" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "subfolders=$subfolders_json" >> $GITHUB_OUTPUT

  build:
    needs: discover-subfolders
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subfolder: ${{ fromJson(needs.discover-subfolders.outputs.subfolders) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.22"

      - name: Read version
        id: get_version
        run: |
          echo "VERSION=$(cat VERSION | head -n 1)" >> $GITHUB_ENV
          echo "VERSION_DESCRIPTION=$(cat VERSION | head -n 3 | tail -n 1)" >> $GITHUB_ENV
        working-directory: .

      - name: Test
        run: |
          cd ${{ matrix.subfolder }}
          go test -race ./...

      # Cross-compile and name assets <tool>_<goos>_<goarch>.tar.gz, which
      # is what each tool's `update` command looks for. A single
      # <tool>.tar.gz cannot be found by it, so self-update silently fails
      # for everyone.
      #
      # Version must be injected here too: without it a released binary
      # reports "dev" and refuses to update itself, so the feature is dead
      # on arrival.
      - name: Cross-compile
        run: |
          cd ${{ matrix.subfolder }}
          LDFLAGS="-s -w -X main.Version=${{ env.VERSION }}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            mkdir -p "dist/$GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" \
              -o "dist/$GOOS/$GOARCH/${{ matrix.subfolder }}" .
            tar -czf "../${{ matrix.subfolder }}_${GOOS}_${GOARCH}.tar.gz" \
              -C "dist/$GOOS/$GOARCH" "${{ matrix.subfolder }}"
          done

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./${{ matrix.subfolder }}_*.tar.gz
          tag_name: ${{ env.VERSION }}
          body: ${{ env.VERSION_DESCRIPTION }}
          draft: false
          prerelease: false
